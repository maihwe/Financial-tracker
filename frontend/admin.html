<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - Financial Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header>

        <h1>Financial Tracker</h1>

        <p>Administrator Dashboard</p>

    </header>


    <main>

        <section id="admin-section">

            <h2>Admin Dashboard</h2>

            <p>
                Welcome to the administrator area.
            </p>


            <!-- ============================= -->
            <!-- SYSTEM STATISTICS              -->
            <!-- ============================= -->

            <section id="system-statistics">

                <h2>System Statistics</h2>

                <div id="statistics-container">

                    <p id="statistics-loading">
                        Loading statistics...
                    </p>

                </div>

            </section>


            <!-- ============================= -->
            <!-- USER MANAGEMENT                -->
            <!-- ============================= -->

            <section id="user-management">

                <h2>User Management</h2>

                <p>
                    View registered users and their roles.
                </p>

                <div id="users-container">

                    <p id="users-loading">
                        Loading users...
                    </p>

                </div>

            </section>

        </section>

    </main>


    <script src="js/admin.js"></script>

    <script src="js/admin-users.js"></script>

    <script src="js/admin-statistics.js"></script>

</body>

</html>
