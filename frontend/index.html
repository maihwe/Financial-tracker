<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financial Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Financial Tracker</h1>
        <p>Manage your income and expenses</p>
    </header>

    <main>

        <!-- Financial Summary -->
        <section id="summary">

            <h2>Financial Summary</h2>

            <div>
                <h3>Total Income</h3>
                <p id="total-income">₦0.00</p>
            </div>

            <div>
                <h3>Total Expenses</h3>
                <p id="total-expenses">₦0.00</p>
            </div>

            <div>
                <h3>Balance</h3>
                <p id="balance">₦0.00</p>
            </div>

        </section>


        <!-- Transaction Form -->
        <section id="add-transaction">

            <h2 id="form-title">Add Transaction</h2>

            <form id="transaction-form">

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Transaction title"
                    required
                >

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Amount"
                    min="0"
                    step="0.01"
                    required
                >

                <input
                    type="text"
                    id="category"
                    name="category"
                    placeholder="Category"
                    required
                >

                <select
                    id="type"
                    name="type"
                    required
                >
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <button
                    type="submit"
                    id="submit-button"
                >
                    Add Transaction
                </button>

                <button
                    type="button"
                    id="cancel-button"
                    hidden
                >
                    Cancel Edit
                </button>

            </form>

        </section>


        <!-- Transaction History -->
        <section id="transactions">

            <h2>Transactions</h2>

            <div id="transaction-list"></div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
